name: Build KBrat POS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Pregateste APK-ul
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/KBratPOS.apk

      - name: Incarca APK-ul
        uses: actions/upload-artifact@v4
        with:
          name: KBratPOS-apk
          path: out/KBratPOS.apk
